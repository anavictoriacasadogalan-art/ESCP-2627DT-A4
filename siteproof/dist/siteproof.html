<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SiteProof</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="SiteProof: construction-site issue reporting and follow-up (course prototype, fictional data).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>:root{--navy:#172033;--muted:#64748b;--bg:#f4f6f8;--surface:#fff;--teal:#0f766e;--teal-dark:#115e59;--blue:#2563eb;--amber:#b45309;--red:#b91c1c;--green:#15803d;--border:#dbe2ea;--shadow:0 10px 30px rgba(23,32,51,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app-shell{min-height:100vh}.topbar{background:var(--navy);color:#fff;padding:16px 5vw;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;letter-spacing:.04em}.topbar small{color:#cbd5e1}.container{max-width:1180px;margin:0 auto;padding:28px 5vw 56px}.notice{padding:12px 16px;border-radius:10px;background:#e0f2fe;border:1px solid #bae6fd;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow)}.card h2,.card h3{margin-top:0}.muted{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700}.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:var(--teal-dark)}.btn-secondary{background:#e2e8f0;color:var(--navy)}.btn-danger{background:#fee2e2;color:var(--red)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.stat{font-size:2rem;font-weight:800}.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700;background:#e2e8f0}.badge-new{background:#e2e8f0}.badge-assigned,.badge-progress{background:#dbeafe;color:#1d4ed8}.badge-review{background:#fef3c7;color:var(--amber)}.badge-closed{background:#dcfce7;color:var(--green)}.badge-overdue{background:#fee2e2;color:var(--red);margin-left:6px}.issue-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-top:1px solid var(--border);padding:16px 0}.issue-row:first-child{border-top:0}.issue-row h3{margin:0 0 4px}.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.9rem}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:110px;resize:vertical}.photo{width:100%;max-height:240px;object-fit:cover;border-radius:10px;background:#e2e8f0}.timeline{border-left:3px solid #cbd5e1;padding-left:16px}.timeline-item{margin:0 0 16px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:10px}.error{color:var(--red);font-weight:600}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:5}.login-grid{max-width:850px;margin:20px auto}.role-chip{display:inline-block;margin-bottom:8px;color:var(--teal);font-weight:800;text-transform:uppercase;font-size:.75rem;letter-spacing:.08em}@media(max-width:700px){.container{padding:22px 4vw 40px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.issue-row{display:block}.issue-row .actions{margin-top:10px}.topbar{padding:14px 4vw}}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <script>(function(){
  const KEY='siteproof.demo.v1';
  const statuses={NEW:'New',ASSIGNED:'Assigned',PROGRESS:'In progress',REVIEW:'Ready for review',CLOSED:'Closed',REWORK:'Rework needed'};
  const now=()=>new Date().toISOString();
  const seedIssues=()=>[
    {id:'SP-0001',title:'Cracked bathroom tile',type:'Damage',location:'Building A · Floor 2 · Apartment 204',description:'A tile beside the shower is cracked.',reportedBy:'l.becker',assignee:null,status:statuses.NEW,deadline:null,photo:'tile',history:[{at:now(),by:'Lukas Becker',text:'Issue reported.'}]},
    {id:'SP-0002',title:'Paint missing near stairwell',type:'Workmanship',location:'Building A · Stairwell 1',description:'A small section needs a final coat.',reportedBy:'a.demir',assignee:'t.nowak',status:statuses.ASSIGNED,deadline:'2026-11-20',photo:'paint',history:[{at:now(),by:'Ayşe Demir',text:'Issue reported.'},{at:now(),by:'Katrin Vogel',text:'Assigned to Tomasz Nowak.'}]},
    {id:'SP-0003',title:'Window seal needs review',type:'Installation',location:'Building B · Floor 1 · Apartment 103',description:'The seal looks incomplete around the lower edge.',reportedBy:'j.weber',assignee:'l.becker',status:statuses.REVIEW,deadline:'2026-11-12',photo:'window',completionNote:'Seal replaced and photographed for review.',history:[{at:now(),by:'Jonas Weber',text:'Issue reported.'},{at:now(),by:'Katrin Vogel',text:'Assigned to Lukas Becker.'},{at:now(),by:'Lukas Becker',text:'Submitted repair for review.'}]}
  ];
  function load(){try{const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):seedIssues()}catch(e){return seedIssues()}}
  function save(issues){localStorage.setItem(KEY,JSON.stringify(issues));return issues}
  function reset(){localStorage.removeItem(KEY);return seedIssues()}
  function activeUser(){return sessionStorage.getItem('siteproof.user')}
  function setUser(id){sessionStorage.setItem('siteproof.user',id)}
  function getIssues(){return load()}
  function actor(users,id){return users.find(u=>u.id===id)?.name||id}
  window.SiteProofStore={KEY,statuses,now,seedIssues,load,save,reset,activeUser,setUser,getIssues,actor}
})();
</script>
  <script>(function(){
  const svg=(label,bg,accent)=>'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500"><rect width="100%" height="100%" fill="${bg}"/><rect x="90" y="80" width="720" height="340" rx="20" fill="white" stroke="${accent}" stroke-width="10"/><path d="M180 330 L350 180 L500 320 L620 220 L760 350" fill="none" stroke="${accent}" stroke-width="18"/><text x="450" y="455" text-anchor="middle" font-family="Arial" font-size="28" fill="#172033">${label}</text></svg>`);
  window.SiteProofScenes={tile:svg('Demo photo · cracked tile','#dbeafe','#2563eb'),paint:svg('Demo photo · paint area','#fef3c7','#b45309'),window:svg('Demo photo · window seal','#dcfce7','#15803d')};
})();
</script>
  <script>(function(){
  window.SiteProofUsers=[
    {id:'k.vogel',name:'Katrin Vogel',role:'manager',job:'Site manager'},
    {id:'s.kraemer',name:'Stefan Krämer',role:'manager',job:'Project manager'},
    {id:'l.becker',name:'Lukas Becker',role:'worker',job:'Window & door fitter'},
    {id:'a.demir',name:'Ayşe Demir',role:'worker',job:'Electrician'},
    {id:'t.nowak',name:'Tomasz Nowak',role:'worker',job:'Drywall & plastering'},
    {id:'j.weber',name:'Jonas Weber',role:'worker',job:'Plumber'}
  ];
})();
</script>
  <script>(function(){
  const S=window.SiteProofStore,U=window.SiteProofUsers,scenes=window.SiteProofScenes;
  let issues=S.getIssues();
  const app=document.getElementById('app'),toast=document.getElementById('toast');
  const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const me=()=>U.find(u=>u.id===S.activeUser()); const userName=id=>S.actor(U,id);
  const badge=s=>`<span class="badge badge-${s===S.statuses.NEW?'new':s===S.statuses.ASSIGNED?'assigned':s===S.statuses.PROGRESS||s===S.statuses.REWORK?'progress':s===S.statuses.REVIEW?'review':'closed'}">${esc(s)}</span>`;
  const overdue=i=>i.deadline&&i.status!==S.statuses.CLOSED&&new Date(i.deadline)<new Date();
  function notify(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2500)}
  function save(){S.save(issues)}
  function shell(content){app.innerHTML=`<div class="app-shell"><header class="topbar"><div><div class="brand">SITEPROOF</div><small>Construction defect communication</small></div><div>${me()?esc(me().name)+' · '+esc(me().job):''}</div></header><main class="container">${content}</main></div>`}
  function issueRow(i,manager){return `<div class="issue-row"><div><h3>${esc(i.id)} · ${esc(i.title)}</h3><div class="meta">${badge(i.status)} ${overdue(i)?'<span class="badge badge-overdue">Overdue</span>':''}<span>${esc(i.location||'Location not supplied')}</span><span>${i.assignee?'Assigned to '+esc(userName(i.assignee)):'Unassigned'}</span>${i.deadline?`<span>Due ${esc(i.deadline)}</span>`:''}</div></div><div class="actions"><button class="btn btn-secondary" data-open="${i.id}">Open</button></div></div>`}
  function login(){shell(`<div class="notice"><strong>Course prototype:</strong> fictional users, issues and demo images. Login is simulated.</div><section class="card login-grid"><h1>Sign in to SiteProof</h1><p class="muted">Choose a fictional demo account. Any password is accepted.</p><div class="grid">${U.map(u=>`<button class="card" data-login="${u.id}"><span class="role-chip">${esc(u.role)}</span><h2>${esc(u.name)}</h2><p class="muted">${esc(u.job)}</p></button>`).join('')}</div></section>`)}
  function nav(){return `<div class="toolbar"><button class="btn btn-secondary" data-home>Home</button><div class="actions"><button class="btn btn-secondary" data-switch>Switch user</button><button class="btn btn-danger" data-reset>Reset demo data</button></div></div>`}
  function dashboard(){const m=me(), manager=m.role==='manager';let list=manager?issues:issues.filter(i=>i.reportedBy===m.id||i.assignee===m.id);const open=list.filter(i=>i.status!==S.statuses.CLOSED).length; shell(`${nav()}<div class="toolbar"><div><h1>${manager?'Manager dashboard':'My work'}</h1><p class="muted">${manager?'Review, assign and verify SiteProof issues.':'Your reports and assigned tasks.'}</p></div>${!manager?'<button class="btn btn-primary" data-report>+ Report an issue</button>':''}</div><div class="grid"><div class="card"><div class="muted">Visible issues</div><div class="stat">${list.length}</div></div><div class="card"><div class="muted">Open issues</div><div class="stat">${open}</div></div><div class="card"><div class="muted">Overdue</div><div class="stat">${list.filter(overdue).length}</div></div></div><section class="card" style="margin-top:20px"><h2>${manager?'All issues':'My issues and tasks'}</h2>${list.length?list.map(i=>issueRow(i,manager)).join(''):'<div class="empty">No issues to show.</div>'}</section>`)}
  function report(){shell(`${nav()}<section class="card"><h1>Report an issue</h1><p class="muted">Capture enough context for another person to act without calling you.</p><form id="reportForm" class="form-grid"><div class="field"><label for="title">Short title *</label><input id="title" required placeholder="e.g. Cracked bathroom tile"></div><div class="field"><label for="type">Type</label><select id="type"><option>Damage</option><option>Workmanship</option><option>Installation</option><option>Safety</option></select></div><div class="field full"><label for="location">Location *</label><input id="location" required placeholder="Building, floor, apartment or room"></div><div class="field full"><label for="description">What happened? *</label><textarea id="description" required></textarea></div><div class="field"><label for="noticed">When noticed?</label><input id="noticed" type="date"></div><div class="field"><label for="cause">Suspected cause</label><select id="cause"><option>Unknown</option><option>Material</option><option>Workmanship</option><option>Other trade</option></select></div><div class="field full"><label for="photo">Photo (optional)</label><input id="photo" type="file" accept="image/*"></div><p id="formError" class="error full"></p><div class="actions full"><button class="btn btn-primary">Submit report</button><button type="button" class="btn btn-secondary" data-home>Cancel</button></div></form></section>`)}
  function detail(id){const i=issues.find(x=>x.id===id),m=me();if(!i){dashboard();return}const manager=m.role==='manager';let actions='';if(manager&&i.status===S.statuses.NEW)actions=`<form id="assignForm" class="form-grid"><div class="field"><label for="assignee">Assign to</label><select id="assignee">${U.filter(u=>u.role==='worker').map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label for="deadline">Deadline</label><input id="deadline" type="date" required></div><div class="field full"><label for="instructions">Instructions</label><textarea id="instructions" placeholder="What should be corrected?"></textarea></div><div class="actions full"><button class="btn btn-primary">Assign issue</button></div></form>`;if(manager&&i.status===S.statuses.REVIEW)actions=`<div class="actions"><button class="btn btn-primary" data-close="${i.id}">Approve and close</button><button class="btn btn-danger" data-rework="${i.id}">Send back for rework</button></div>`;if(!manager&&(i.assignee===m.id||i.reportedBy===m.id)){if(i.status===S.statuses.ASSIGNED||i.status===S.statuses.REWORK)actions+=`<button class="btn btn-primary" data-start="${i.id}">Start work</button>`;if(i.status===S.statuses.PROGRESS)actions+=`<form id="doneForm"><div class="field"><label for="completion">Completion note</label><textarea id="completion" required placeholder="What did you repair?"></textarea></div><button class="btn btn-primary">Mark as done for review</button></form>`}shell(`${nav()}<section class="card"><div class="toolbar"><div><h1>${esc(i.title)}</h1><div class="meta">${esc(i.id)} ${badge(i.status)} ${overdue(i)?'<span class="badge badge-overdue">Overdue</span>':''}</div></div></div><div class="grid"><div><h3>Original report</h3><p><strong>Location:</strong> ${esc(i.location)}</p><p>${esc(i.description)}</p><p class="muted">Reported by ${esc(userName(i.reportedBy))}</p>${i.photo?`<img class="photo" src="${scenes[i.photo]||i.photo}" alt="Demo image for ${esc(i.title)}">`:''}</div><div><h3>Assignment</h3><p><strong>Responsible:</strong> ${i.assignee?esc(userName(i.assignee)):'Not assigned'}</p><p><strong>Deadline:</strong> ${esc(i.deadline||'Not set')}</p>${i.completionNote?`<h3>Completion evidence</h3><p>${esc(i.completionNote)}</p>`:''}<div class="actions">${actions}</div></div></div><h3>Activity history</h3><div class="timeline">${i.history.map(h=>`<div class="timeline-item"><strong>${esc(h.text)}</strong><br><span class="muted">${esc(h.by)} · ${new Date(h.at).toLocaleString()}</span></div>`).join('')}</div></section>`);bindDetail(i)}
  function bindDetail(i){const f=document.getElementById('assignForm');if(f)f.onsubmit=e=>{e.preventDefault();i.assignee=document.getElementById('assignee').value;i.deadline=document.getElementById('deadline').value;i.status=S.statuses.ASSIGNED;i.history.push({at:S.now(),by:me().name,text:`Assigned to ${userName(i.assignee)}.`});save();notify('Issue assigned');detail(i.id)};const d=document.getElementById('doneForm');if(d)d.onsubmit=e=>{e.preventDefault();i.completionNote=document.getElementById('completion').value;i.status=S.statuses.REVIEW;i.history.push({at:S.now(),by:me().name,text:'Submitted repair for manager review.'});save();notify('Repair submitted');detail(i.id)};document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{i.status=S.statuses.PROGRESS;i.history.push({at:S.now(),by:me().name,text:'Started work.'});save();detail(i.id)});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{i.status=S.statuses.CLOSED;i.history.push({at:S.now(),by:me().name,text:'Approved and closed.'});save();notify('Issue closed');detail(i.id)});document.querySelectorAll('[data-rework]').forEach(b=>b.onclick=()=>{const reason=prompt('Why is more work needed?','Please correct the remaining issue.');if(reason){i.status=S.statuses.REWORK;i.history.push({at:S.now(),by:me().name,text:'Sent back for rework: '+reason});save();detail(i.id)}})}
  function bind(){document.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>{S.setUser(b.dataset.login);dashboard()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detail(b.dataset.open));document.querySelectorAll('[data-home]').forEach(b=>b.onclick=dashboard);document.querySelectorAll('[data-report]').forEach(b=>b.onclick=report);document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=login);document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{if(confirm('Reset fictional demo data?')){issues=S.reset();dashboard()}});const f=document.getElementById('reportForm');if(f)f.onsubmit=e=>{e.preventDefault();const title=document.getElementById('title').value.trim(),location=document.getElementById('location').value.trim(),description=document.getElementById('description').value.trim();if(!title||!location||!description){document.getElementById('formError').textContent='Please complete the required fields.';return}const n=String(issues.length+1).padStart(4,'0');const file=document.getElementById('photo').files[0];const issue={id:'SP-'+n,title,type:document.getElementById('type').value,location,description,reportedBy:me().id,assignee:null,status:S.statuses.NEW,deadline:null,photo:file?null:'tile',history:[{at:S.now(),by:me().name,text:'Issue reported.'}]};issues.unshift(issue);save();notify('Issue '+issue.id+' submitted');detail(issue.id)}}
  function render(){S.activeUser()?dashboard():login();bind()}
  const oldRender=window.SiteProofRender=render;window.SiteProofRefresh=()=>{oldRender();bind()};render();
})();
</script>
</body>
</html>
